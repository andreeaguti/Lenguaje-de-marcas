<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>TechShop | Carrito</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <nav class="nav container">
      <a class="brand" href="index.html">TechShop</a>
      <div class="nav__links">
        <a class="nav__link nav__link--active" href="carrito.html">Carrito</a>
        <button id="themeToggle" class="toggle">Modo</button>
      </div>
    </nav>
  </header>

  <main class="container">
    <section class="panel">
      <h1>Tu Carrito</h1>
      <ul id="cartList" class="cart__list">
        </ul>
      <div class="cart__total">
        <span>Total a pagar:</span>
        <strong id="totalPrice">0,00 €</strong>
      </div>
      <button class="btn btn--ghost" id="clearCart">Vaciar Carrito</button>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
