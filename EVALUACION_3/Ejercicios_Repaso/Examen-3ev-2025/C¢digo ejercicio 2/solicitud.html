<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vende tu Moto - Motos Cholo</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="header">
        <div class="title-container">
            <h1 class="title">Compramos tu Moto</h1>
        </div>
        <nav class="menu">
            <ul>
                <li><a href="catalogo.html">Catálogo</a></li>
            </ul>
        </nav>
    </header>

    <main class="main">
        <div class="promo-text">Dinos qué moto quieres vender</div>

        <section class="product form-wrapper">
            <form id="formContacto">
                <div class="form-group">
                    <label class="product-title">Teléfono de contacto:</label>
                    <input type="tel" id="telefono" name="telefono" required>
                </div>

                <div class="form-group">
                    <label class="product-title">Descripción de la moto:</label>
                    <textarea id="descripcion" name="descripcion" rows="4" required></textarea>
                </div>

                <button type="submit" class="buy-button">Enviar Información</button>
            </form>
        </section>
    </main>

    <script src="scriptSolicitud.js"></script>
</body>
</html>
