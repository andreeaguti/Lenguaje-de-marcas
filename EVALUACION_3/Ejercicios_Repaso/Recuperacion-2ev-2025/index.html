<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Examen Restaurante - Maqueta Real</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="main-wrapper">
        <div class="admin-controls">
            <button id="btnHeaderColor">Color Header</button>
            <button id="btnBodyColor">Color Fondo</button>
            <button id="btnReset">Reset</button>
        </div>

        <header id="mainHeader">
            <div class="logo-area">Imagen Corporativa de La Empresa</div>
        </header>

        <main class="menu-grid">
            <section class="menu-column">
                <div class="col-header">Primeros Platos</div>
                <div class="col-content">
                    <span>Nombre de los platos</span>
                    <span class="price-tag">Precios</span>
                </div>
            </section>

            <section class="menu-column">
                <div class="col-header">Segundos Platos</div>
                <div class="col-content">
                    <span>Nombre de los platos</span>
                    <span class="price-tag">Precios</span>
                </div>
            </section>

            <section class="menu-column">
                <div class="col-header">Postres</div>
                <div class="col-content">
                    <span>Nombre de los platos</span>
                    <span class="price-tag">Precios</span>
                </div>
            </section>

            <section class="menu-column">
                <div class="col-header">Carta de Vinos</div>
                <div class="col-content">
                    <span>Nombre de los platos</span>
                    <span class="price-tag">Precios</span>
                </div>
            </section>
        </main>

        <footer class="footer-grid">
            <div class="footer-item">Aviso Legal</div>
            <div class="footer-item">Política de Privacidad</div>
        </footer>
    </div>

    <script src="scriptBody.js"></script>
    <script src="scriptHead.js"></script>
    <script src="scriptReset.js"></script>
</body>
</html>
