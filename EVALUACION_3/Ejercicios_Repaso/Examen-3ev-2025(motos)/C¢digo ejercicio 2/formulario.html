<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario - Motos Cholo</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="header">
        <div class="title-container">
            <h1 class="title">Finalizar Compra</h1>
        </div>
        <nav class="menu">
            <ul>
                <li><a href="catalogo.html">Volver al Catálogo</a></li>
            </ul>
        </nav>
    </header>

    <main class="main">
        <div class="product" style="max-width: 500px; margin: 0 auto;">
            <h2 class="product-title">Tus Datos</h2>
            
            <form action="#">
                <p>Nombre:</p>
                <input type="text" style="width: 100%; margin-bottom: 15px; padding: 5px;">
                
                <p>Email:</p>
                <input type="email" style="width: 100%; margin-bottom: 15px; padding: 5px;">
                
                <p>Dirección:</p>
                <input type="text" style="width: 100%; margin-bottom: 15px; padding: 5px;">

                <button type="submit" class="buy-button" style="width: 100%;">
                    Enviar Pedido
                </button>
            </form>
        </div>
    </main>
</body>
</html>
